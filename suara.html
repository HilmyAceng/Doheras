<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Volume to Text Size</title>    
</head>
<style>
    #image {
        position: absolute;
        left: 90vw;
        top: 50%;
        transform: translateY(-50%);
        width: 100px;
        transition: right 0.1s;
        -webkit-transform: scaleX(-1);
    }

    body {
        height: 100vh;
        margin: 0;
        overflow: hidden;
    }

    button {
        position: absolute;
        top: 10px;
        left: 10px;
    }
</style>
<body>
    <button id="startButton">Mulai</button>
    <img id="image" src="1276128_720.jpg" alt="Moving Image">

<script>
const startButton = document.getElementById('startButton');
const imageElement = document.getElementById('image');

let audioContext;
let analyser;
let microphone;
let javascriptNode;

function startListening() {
    // Buat audio context
    audioContext = new (window.AudioContext || window.webkitAudioContext)();

    // Minta akses mikrofon
    navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
            microphone = audioContext.createMediaStreamSource(stream);
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;

            microphone.connect(analyser);

            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
            javascriptNode.connect(audioContext.destination);

            javascriptNode.onaudioprocess = () => {
                let array = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(array);
                let volume = array.reduce((a, b) => a + b, 0) / array.length;

                // Ubah posisi gambar berdasarkan volume suara
                let newPosition = Math.max(0, Math.min(90, 90 - volume / 2));  // Posisi gambar dari kanan (0% - 90%)
                imageElement.style.left = newPosition + 'vw';  // Ubah posisi `right` gambar
            };
        })
        .catch((err) => {
            console.error('Error accessing microphone: ', err);
        });
}

startButton.addEventListener('click', startListening);

</script>
</body>
</html>
